<!DOCTYPE html>
<html lang="en">
<head>

    <title>Controller Dashboard</title>
</head>
<body>
    <h1>Controller Dashboard</h1>
    <h2>Voting Sessions</h2>

        {% for session in sessions %}

        {% endfor %}
    </ul>
</body>
</html>
